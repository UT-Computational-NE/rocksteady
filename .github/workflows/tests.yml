name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Current releases of numpy and pandas on every supported Python.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -m "not slow"

  # The oldest numpy and pandas that pyproject.toml promises, on the oldest supported Python.
  min-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install "numpy==1.22.*" "pandas==1.5.*" pytest
      - run: python -m pip install --no-deps -e .
      - run: python -c "import numpy, pandas; print('numpy', numpy.__version__, 'pandas', pandas.__version__)"
      - run: python -m pytest -m "not slow"

  # mypy over src/rocksteady (configured in pyproject.toml), with current numpy, whose type stubs it checks against.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[typecheck]"
      - run: python -m mypy

  # pylint on the messages tools/lint.sh enforces, over src, tests, tools and examples.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[lint]"
      - run: tools/lint.sh

  # The Read the Docs site (https://rocksteady.readthedocs.io), built as Read the Docs builds it:
  # any Sphinx warning (for example a malformed docstring) fails the job.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[docs]"
      - run: python -m sphinx -W --keep-going -b html docs/source docs/_build/html

  calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -m slow
      - run: |
          python examples/actuator_steps.py
          python examples/thermal_drift.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      # The sdist's tests/ holds exactly the files git tracks there (MANIFEST.in grafts tests/).
      - name: Check that the sdist ships the tests and their data
        run: |
          diff <(git ls-files tests | sort) \
               <(tar -tzf dist/*.tar.gz | sed -n 's|^[^/]*/\(tests/.*[^/]\)$|\1|p' | sort)
      - run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl pytest
          cd /tmp && /tmp/wheel-env/bin/python -c "import rocksteady; print(rocksteady.__version__)"
      # The sdist's tests (and their data) against the installed wheel, outside the source tree:
      # no editable install, no PYTHONPATH, pytest run as a script so the cwd is not on sys.path, and
      # `-o pythonpath=` so pytest does not put the sdist's src/ first (pyproject.toml does, for development);
      # tests/test_import_source.py fails if they import the sdist's src/ (it has PKG-INFO, a checkout does not).
      - name: Test the sdist against the wheel
        run: |
          mkdir /tmp/sdist && tar -xzf dist/*.tar.gz -C /tmp/sdist
          cd /tmp/sdist/rocksteady-*
          env -u PYTHONPATH /tmp/wheel-env/bin/python -c \
            "import rocksteady; f = rocksteady.__file__; print(f); assert '/tmp/wheel-env/' in f"
          env -u PYTHONPATH /tmp/wheel-env/bin/pytest -m "not slow" -p no:cacheprovider -o pythonpath=

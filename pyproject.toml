[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rocksteady"
dynamic = ["version"]
description = "Steady-state detection for multi-signal experiments with characteristic time constants and external actions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicholas Luciano" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.22", "pandas>=1.5"]
keywords = ["steady state", "steady-state detection", "time series", "process monitoring",
            "drift", "autocorrelation", "metrology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest"]
dev = ["build", "pytest"]

# [project.urls]  -- fill in when the GitHub repository exists
# Homepage = "https://github.com/<org>/rocksteady"
# Issues = "https://github.com/<org>/rocksteady/issues"

[tool.setuptools.dynamic]
version = { attr = "rocksteady.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rocksteady = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: Monte Carlo calibration checks (deselect with -m 'not slow')"]

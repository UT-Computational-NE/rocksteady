[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rocksteady"
dynamic = ["version"]
description = "Steady-state detection for multi-signal experiments with characteristic time constants and external actions"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Nicholas Luciano" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.22", "pandas>=1.5"]
keywords = ["steady state", "steady-state detection", "time series", "process monitoring",
            "drift", "autocorrelation", "metrology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=7"]  # 7.0 added the `pythonpath` option
docs = ["sphinx>=7", "sphinx-rtd-theme>=2", "myst-parser>=2"]
typecheck = ["mypy>=1.10"]
lint = ["pylint>=3", "pycodestyle>=2.11"]
dev = ["rocksteady[docs,test,typecheck,lint]", "build"]

[project.urls]
Homepage = "https://github.com/UT-Computational-NE/rocksteady"
Issues = "https://github.com/UT-Computational-NE/rocksteady/issues"
Changelog = "https://github.com/UT-Computational-NE/rocksteady/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "rocksteady.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rocksteady = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import this checkout's src/, whatever the environment's install points at (AGENTS.md).
pythonpath = ["src"]
markers = ["slow: Monte Carlo calibration checks (deselect with -m 'not slow')"]
# Unit tests use short windows on purpose; tests of the warning itself use pytest.warns, which still sees it.
# A FutureWarning (a deprecation in numpy or pandas) fails the test that raises it. tests/conftest.py adds
# error::pandas.errors.Pandas4Warning, a DeprecationWarning, where pandas defines it. numpy's DeprecationWarning
# for a timedelta without a unit fails it too: numpy 2.5 and later raise it when pandas 2.x parses a string or
# keywords (CI's pandas2-numpy25 job). The filter matches the message, which every numpy accepts, so it needs no
# version guard.
filterwarnings = ["error::FutureWarning", "error:The 'generic' unit:DeprecationWarning",
                  "ignore::rocksteady.core.CalibrationWarning"]

# tools/check.sh and CI's typecheck job run `mypy` (no arguments: `files` below).
[tool.mypy]
files = ["src/rocksteady"]
python_version = "3.10"
check_untyped_defs = true  # also check the bodies of functions without annotations

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true  # no bundled type information; pandas-stubs is not a dependency

# For editors that lint with pylint: the line length the code uses, and no notices for the docstring, size and
# naming conventions it does not follow. tools/lint.sh, which tools/check.sh and CI run, enforces a few messages only.
[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring", "missing-class-docstring", "missing-function-docstring",
    "too-many-arguments", "too-many-positional-arguments", "too-many-locals", "too-many-branches",
    "too-many-statements", "too-many-instance-attributes", "too-many-return-statements", "too-many-lines",
    "too-few-public-methods",
    "invalid-name",  # math names (T, R, F, B, n_eff) follow the papers and the docs
    "import-outside-toplevel",  # pandas is imported where it is used, so the streaming detector does not need it
]

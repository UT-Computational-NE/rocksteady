[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rocksteady"
version = "0.1.0"
description = "Steady-state detection for experiments with characteristic time constants, several signals, and external actions"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "pandas>=1.5"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["rocksteady"]
